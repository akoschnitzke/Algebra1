<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algebra 1 Logic Puzzles</title>
    <style>
        :root {
            --bg-color: #f4f7fe;
            --card-bg: #ffffff;
            --primary: #4361ee;
            --primary-hover: #3a56d4;
            --success: #2ec4b6;
            --error: #e63946;
            --text: #2b2d42;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .game-card {
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 30px;
            max-width: 580px;
            width: 100%;
            text-align: center;
        }

        h1 { margin-top: 0; font-size: 1.8rem; color: var(--primary); }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        select, input[type="number"] {
            width: 100%;
            padding: 10px;
            font-size: 1rem;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            box-sizing: border-box;
        }

        .checkbox-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: normal;
            background: #f8f9fa;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #edf2f7;
            cursor: pointer;
        }

        .range-inputs {
            display: flex;
            gap: 10px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .badge {
            background: #eef2ff;
            color: var(--primary);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.95rem;
        }

        .equation-box {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            font-size: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: 2px solid #edf2f7;
        }

        .target-equation {
            background: #eef2ff;
            border-color: #c7d2fe;
            font-weight: bold;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn:active { transform: scale(0.98); }
        .btn-primary { background-color: var(--primary); color: white; width: 100%; }
        .btn-primary:hover { background-color: var(--primary-hover); }
        .btn-submit { background-color: var(--primary); color: white; }
        .btn-secondary { background-color: #e2e8f0; color: #475569; margin-top: 10px; width: 100%; }

        .feedback {
            margin-top: 15px;
            font-weight: bold;
            min-height: 24px;
        }
        .feedback.correct { color: var(--success); }
        .feedback.incorrect { color: var(--error); }
        .hint-text { color: #64748b; font-size: 0.9rem; margin-top: 8px; text-align: left; background: #f8f9fa; padding: 10px; border-radius: 8px; }
    </style>
</head>
<body>

<div class="game-card">
    <div id="menu-screen">
        <h1>Algebra 1 Logic Puzzles</h1>
        <p style="color: #64748b; font-size: 0.95rem; margin-bottom: 25px;">Customize your puzzle parameters:</p>

        <div class="form-group">
            <label for="num-vars">Total Unique Symbols:</label>
            <select id="num-vars">
                <option value="3" selected>3 Symbols</option>
                <option value="4">4 Symbols</option>
            </select>
        </div>

        <div class="form-group">
            <label>Allowed Operations & Features:</label>
            <div class="checkbox-group">
                <label class="checkbox-label"><input type="checkbox" id="op-add" checked disabled> Addition (+)</label>
                <label class="checkbox-label"><input type="checkbox" id="op-sub" checked> Subtraction (-)</label>
                <label class="checkbox-label"><input type="checkbox" id="op-mul" checked> Multiplication (×)</label>
                <label class="checkbox-label"><input type="checkbox" id="op-div"> Division (÷)</label>
                <label class="checkbox-label"><input type="checkbox" id="op-paren" checked> Parentheses ( )</label>
                <label class="checkbox-label"><input type="checkbox" id="op-exp"> Exponents (x², x³)</label>
            </div>
        </div>

        <div class="form-group">
            <label>Value Range for Symbols:</label>
            <div class="range-inputs">
                <input type="number" id="val-min" value="1" min="1" placeholder="Min">
                <input type="number" id="val-max" value="8" min="2" placeholder="Max">
            </div>
        </div>

        <button class="btn btn-primary" onclick="startGame()">Start Game 🚀</button>
    </div>

    <div id="game-screen" style="display: none;">
        <div class="header">
            <span class="badge" id="score-display">Score: 0</span>
            <span style="font-weight: bold; color: var(--primary);">Algebra 1 Logic Puzzles</span>
            <button class="btn btn-secondary" style="width: auto; margin:0; padding: 6px 12px;" onclick="showMenu()">⚙️ Settings</button>
        </div>

        <div id="equations-container"></div>

        <div class="input-group">
            <input type="number" id="user-answer" placeholder="?" autocomplete="off">
            <button class="btn btn-submit" onclick="checkAnswer()">Submit</button>
        </div>

        <div class="feedback" id="feedback"></div>
        <button class="btn btn-secondary" onclick="toggleHint()">💡 Need a Hint?</button>
        <div class="hint-text" id="hint-box" style="display: none;"></div>
    </div>
</div>

<script>
    const SYMBOLS_POOL = ['🍎', '🍌', '🍇', '🍊', '🍓', '🥑', '🍍', '🍉'];
    
    let config = {
        numVars: 3,
        ops: ['+'],
        useParen: true,
        useExp: false,
        minVal: 1,
        maxVal: 8
    };

    let currentSolution = 0;
    let currentScore = 0;
    let currentHint = "";

    function getRandomInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function getRandomElement(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
    }

    function showMenu() {
        document.getElementById('menu-screen').style.display = 'block';
        document.getElementById('game-screen').style.display = 'none';
    }

    function startGame() {
        config.numVars = parseInt(document.getElementById('num-vars').value, 10);
        
        config.ops = ['+'];
        if (document.getElementById('op-sub').checked) config.ops.push('-');
        if (document.getElementById('op-mul').checked) config.ops.push('*');
        if (document.getElementById('op-div').checked) config.ops.push('/');

        config.useParen = document.getElementById('op-paren').checked;
        config.useExp = document.getElementById('op-exp').checked;

        let min = parseInt(document.getElementById('val-min').value, 10) || 1;
        let max = parseInt(document.getElementById('val-max').value, 10) || 8;
        if (min >= max) max = min + 4;
        config.minVal = min;
        
        // Cap max value lower if exponents are enabled to prevent huge numbers
        config.maxVal = config.useExp ? Math.min(max, 5) : max;

        document.getElementById('menu-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'block';

        generatePuzzle();
    }

    function evalOp(a, op, b) {
        switch(op) {
            case '+': return a + b;
            case '-': return a - b;
            case '*': return a * b;
            case '/': return a / b;
        }
    }

    function formatOp(op) {
        if (op === '*') return '×';
        if (op === '/') return '÷';
        return op;
    }

    function generatePuzzle() {
        document.getElementById('feedback').innerText = '';
        document.getElementById('user-answer').value = '';
        document.getElementById('hint-box').style.display = 'none';

        const shuffled = [...SYMBOLS_POOL].sort(() => 0.5 - Math.random());
        let vars = [];
        
        for (let i = 0; i < config.numVars; i++) {
            vars.push({ symbol: shuffled[i], value: getRandomInt(config.minVal, config.maxVal) });
        }

        let equationsHTML = "";
        let hintSteps = [];

        const v0 = vars[0];
        const v1 = vars[1];
        const v2 = vars[2];
        const v3 = vars[3] || vars[0];

        // --- CLUE 1 (3 terms: A + A + A = total OR exponent A² + A = total) ---
        let clue1Val = 0;
        let clue1Text = "";
        if (config.useExp && Math.random() > 0.5) {
            const exp = getRandomElement([2, 3]);
            clue1Val = Math.pow(v0.value, exp) + v0.value + v0.value;
            clue1Text = `${v0.symbol}<sup>${exp}</sup> + ${v0.symbol} + ${v0.symbol}`;
            hintSteps.push(`Clue 1: ${v0.symbol}<sup>${exp}</sup> + 2 × ${v0.symbol} = ${clue1Val} → <b>${v0.symbol} = ${v0.value}</b>`);
        } else {
            clue1Val = v0.value + v0.value + v0.value;
            clue1Text = `${v0.symbol} + ${v0.symbol} + ${v0.symbol}`;
            hintSteps.push(`Clue 1: 3 × ${v0.symbol} = ${clue1Val} → <b>${v0.symbol} = ${v0.value}</b>`);
        }
        equationsHTML += `<div class="equation-box">${clue1Text} = ${clue1Val}</div>`;

        // --- CLUE 2 (3 terms with optional Parentheses) ---
        let op2_1 = getRandomElement(config.ops);
        let op2_2 = getRandomElement(config.ops);

        if (op2_1 === '/' && (v0.value % v1.value !== 0)) op2_1 = '+';
        if (op2_1 === '-' && (v0.value < v1.value)) op2_1 = '+';

        let clue2Val = 0;
        let clue2Text = "";

        if (config.useParen) {
            const innerVal = evalOp(v1.value, op2_2, v1.value);
            clue2Val = evalOp(v0.value, op2_1, innerVal);
            clue2Text = `${v0.symbol} ${formatOp(op2_1)} (${v1.symbol} ${formatOp(op2_2)} ${v1.symbol})`;
            hintSteps.push(`Clue 2: ${v0.value} ${formatOp(op2_1)} (${v1.symbol} ${formatOp(op2_2)} ${v1.symbol}) = ${clue2Val} → <b>${v1.symbol} = ${v1.value}</b>`);
        } else {
            const tempVal = evalOp(v1.value, op2_2, v1.value);
            clue2Val = evalOp(v0.value, op2_1, tempVal);
            clue2Text = `${v0.symbol} ${formatOp(op2_1)} ${v1.symbol} ${formatOp(op2_2)} ${v1.symbol}`;
            hintSteps.push(`Clue 2: ${v0.value} ${formatOp(op2_1)} ${v1.symbol} ${formatOp(op2_2)} ${v1.symbol} = ${clue2Val} → <b>${v1.symbol} = ${v1.value}</b>`);
        }
        equationsHTML += `<div class="equation-box">${clue2Text} = ${clue2Val}</div>`;

        // --- CLUE 3 (Multi-variable expression with at least 3 terms) ---
        let op3 = getRandomElement(config.ops);
        if (op3 === '/' && (v1.value % v2.value !== 0)) op3 = '+';
        if (op3 === '-' && (v1.value < v2.value)) op3 = '+';

        let clue3HTML = "";
        let clue3Val = 0;

        if (config.numVars === 4) {
            let op4 = getRandomElement(config.ops);
            if (op4 === '/' && (v2.value % v3.value !== 0)) op4 = '+';
            if (op4 === '-' && (v2.value < v3.value)) op4 = '+';

            if (config.useParen) {
                clue3Val = v0.value + evalOp(evalOp(v1.value, op3, v2.value), '+', v3.value);
                clue3HTML = `${v0.symbol} + (${v1.symbol} ${formatOp(op3)} ${v2.symbol}) + ${v3.symbol}`;
            } else {
                clue3Val = v0.value + v1.value + evalOp(v2.value, op4, v3.value);
                clue3HTML = `${v0.symbol} + ${v1.symbol} + ${v2.symbol} ${formatOp(op4)} ${v3.symbol}`;
            }
            hintSteps.push(`Clue 3: ${v0.value} + ${v1.value} + ... = ${clue3Val} → <b>${v2.symbol} = ${v2.value}</b>, <b>${v3.symbol} = ${v3.value}</b>`);
        } else {
            if (config.useParen) {
                clue3Val = evalOp(v0.value, '+', evalOp(v1.value, op3, v2.value));
                clue3HTML = `${v0.symbol} + (${v1.symbol} ${formatOp(op3)} ${v2.symbol})`;
            } else {
                clue3Val = v0.value + evalOp(v1.value, op3, v2.value);
                clue3HTML = `${v0.symbol} + ${v1.symbol} ${formatOp(op3)} ${v2.symbol}`;
            }
            hintSteps.push(`Clue 3: ${v0.value} + (${v1.symbol} ${formatOp(op3)} ${v2.symbol}) = ${clue3Val} → <b>${v2.symbol} = ${v2.value}</b>`);
        }
        equationsHTML += `<div class="equation-box">${clue3HTML} = ${clue3Val}</div>`;

        // --- TARGET EQUATION ---
        let targetOp = config.ops.includes('*') ? '*' : getRandomElement(config.ops);
        let targetText = "";

        if (config.useExp && Math.random() > 0.5) {
            const expVal = getRandomElement([2, 3]);
            currentSolution = Math.pow(v0.value, expVal) + evalOp(v1.value, targetOp, v2.value);
            targetText = `${v0.symbol}<sup>${expVal}</sup> + ${v1.symbol} ${formatOp(targetOp)} ${v2.symbol} = ?`;
            currentHint = hintSteps.join('<br>') + `<br><b>Final Calculation:</b> ${v0.value}<sup>${expVal}</sup> + (${v1.value} ${formatOp(targetOp)} ${v2.value}) = <b>${currentSolution}</b>`;
        } else if (config.useParen) {
            currentSolution = evalOp(v0.value + v1.value, targetOp, v2.value);
            targetText = `(${v0.symbol} + ${v1.symbol}) ${formatOp(targetOp)} ${v2.symbol} = ?`;
            currentHint = hintSteps.join('<br>') + `<br><b>Final Calculation:</b> (${v0.value} + ${v1.value}) ${formatOp(targetOp)} ${v2.value} = <b>${currentSolution}</b>`;
        } else {
            currentSolution = v0.value + evalOp(v1.value, targetOp, v2.value);
            targetText = `${v0.symbol} + ${v1.symbol} ${formatOp(targetOp)} ${v2.symbol} = ?`;
            currentHint = hintSteps.join('<br>') + `<br><b>Final Calculation:</b> ${v0.value} + (${v1.value} ${formatOp(targetOp)} ${v2.value}) = <b>${currentSolution}</b>`;
        }

        equationsHTML += `<div class="equation-box target-equation">${targetText}</div>`;

        document.getElementById('equations-container').innerHTML = equationsHTML;
    }

    function checkAnswer() {
        const inputElement = document.getElementById('user-answer');
        const feedbackElement = document.getElementById('feedback');
        const userAnswer = parseFloat(inputElement.value);

        if (isNaN(userAnswer)) {
            feedbackElement.className = "feedback incorrect";
            feedbackElement.innerText = "Please enter a valid number!";
            return;
        }

        if (Math.abs(userAnswer - currentSolution) < 0.01) {
            feedbackElement.className = "feedback correct";
            feedbackElement.innerText = "🎉 Correct! Great job!";
            currentScore += 10;
            document.getElementById('score-display').innerText = `Score: ${currentScore}`;
            
            setTimeout(() => {
                generatePuzzle();
            }, 1500);
        } else {
            feedbackElement.className = "feedback incorrect";
            feedbackElement.innerText = "❌ Not quite right. Try again or check the hint!";
        }
    }

    function toggleHint() {
        const hintBox = document.getElementById('hint-box');
        if (hintBox.style.display === 'none') {
            hintBox.innerHTML = currentHint;
            hintBox.style.display = 'block';
        } else {
            hintBox.style.display = 'none';
        }
    }

    document.getElementById('user-answer').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            checkAnswer();
        }
    });
</script>

</body>
</html>
