<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algebra Emoji Logic Puzzle</title>
    <style>
        :root {
            --bg-color: #f4f7fe;
            --card-bg: #ffffff;
            --primary: #4361ee;
            --success: #2ec4b6;
            --error: #e63946;
            --text: #2b2d42;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .game-card {
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 30px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .badge {
            background: #eef2ff;
            color: var(--primary);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.95rem;
        }

        .equation-box {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border: 2px solid #edf2f7;
        }

        .target-equation {
            background: #eef2ff;
            border-color: #c7d2fe;
            font-weight: bold;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        input[type="number"] {
            flex: 1;
            padding: 12px;
            font-size: 1.2rem;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            text-align: center;
            outline: none;
        }

        input[type="number"]:focus {
            border-color: var(--primary);
        }

        button {
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-submit {
            background-color: var(--primary);
            color: white;
        }

        .btn-hint {
            background-color: #e2e8f0;
            color: #475569;
            margin-top: 10px;
            width: 100%;
        }

        .feedback {
            margin-top: 15px;
            font-weight: bold;
            min-height: 24px;
        }

        .feedback.correct { color: var(--success); }
        .feedback.incorrect { color: var(--error); }
        .hint-text { color: #64748b; font-size: 0.9rem; margin-top: 8px; }
    </style>
</head>
<body>

<div class="game-card">
    <div class="header">
        <span class="badge" id="score-display">Score: 0</span>
        <span class="badge" id="level-display">Level 1</span>
    </div>

    <h2>Algebra Logic Puzzle</h2>
    <p style="color: #64748b; font-size: 0.95rem; margin-bottom: 20px;">
        Find the numerical value of each symbol to solve the target equation!
    </p>

    <div id="equations-container"></div>

    <div class="input-group">
        <input type="number" id="user-answer" placeholder="?" autocomplete="off">
        <button class="btn-submit" onclick="checkAnswer()">Submit</button>
    </div>

    <div class="feedback" id="feedback"></div>
    <button class="btn-hint" onclick="toggleHint()">💡 Need a Hint?</button>
    <div class="hint-text" id="hint-box" style="display: none;"></div>
</div>

<script>
    const SYMBOLS = ['🍎', '🍌', '🍇', '🍊', '🍓', '🥑'];
    let currentSolution = 0;
    let currentScore = 0;
    let currentLevel = 1;
    let currentHint = "";

    function getRandomInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function generatePuzzle() {
        // Clear previous state
        document.getElementById('feedback').innerText = '';
        document.getElementById('user-answer').value = '';
        document.getElementById('hint-box').style.display = 'none';
        
        // Pick 3 random distinct symbols
        const shuffled = [...SYMBOLS].sort(() => 0.5 - Math.random());
        const [A_sym, B_sym, C_sym] = shuffled.slice(0, 3);

        // Assign values to symbols (1 to 10 for accessibility)
        const A_val = getRandomInt(2, 10);
        const B_val = getRandomInt(1, 10);
        const C_val = getRandomInt(1, 10);

        // Generate Row Equations
        // Row 1: A + A + A = total1
        const row1_ans = A_val + A_val + A_val;
        
        // Row 2: A + B + B = total2
        const row2_ans = A_val + B_val + B_val;

        // Row 3: B + C = total3
        const row3_ans = B_val + C_val;

        // Row 4 (Target): C + A * B = ? (Includes Order of Operations)
        currentSolution = C_val + (A_val * B_val);

        // Store step-by-step hint
        currentHint = `Step 1: 3 ${A_sym} = ${row1_ans} → ${A_sym} = ${A_val}<br>` +
                      `Step 2: ${A_val} + 2 ${B_sym} = ${row2_ans} → ${B_sym} = ${B_val}<br>` +
                      `Step 3: ${B_val} + ${C_sym} = ${row3_ans} → ${C_sym} = ${C_val}<br>` +
                      `Remember order of operations: ${C_val} + (${A_val} × ${B_val})`;

        // Render equations to DOM
        const container = document.getElementById('equations-container');
        container.innerHTML = `
            <div class="equation-box">${A_sym} + ${A_sym} + ${A_sym} = ${row1_ans}</div>
            <div class="equation-box">${A_sym} + ${B_sym} + ${B_sym} = ${row2_ans}</div>
            <div class="equation-box">${B_sym} + ${C_sym} = ${row3_ans}</div>
            <div class="equation-box target-equation">${C_sym} + ${A_sym} × ${B_sym} = ?</div>
        `;
    }

    function checkAnswer() {
        const inputElement = document.getElementById('user-answer');
        const feedbackElement = document.getElementById('feedback');
        const userAnswer = parseInt(inputElement.value, 10);

        if (isNaN(userAnswer)) {
            feedbackElement.className = "feedback incorrect";
            feedbackElement.innerText = "Please enter a valid number!";
            return;
        }

        if (userAnswer === currentSolution) {
            feedbackElement.className = "feedback correct";
            feedbackElement.innerText = "🎉 Correct! Great job!";
            currentScore += 10;
            currentLevel += 1;
            document.getElementById('score-display').innerText = `Score: ${currentScore}`;
            document.getElementById('level-display').innerText = `Level ${currentLevel}`;
            
            setTimeout(() => {
                generatePuzzle();
            }, 1500);
        } else {
            feedbackElement.className = "feedback incorrect";
            feedbackElement.innerText = "❌ Not quite right. Try again or check the hint!";
        }
    }

    function toggleHint() {
        const hintBox = document.getElementById('hint-box');
        if (hintBox.style.display === 'none') {
            hintBox.innerHTML = currentHint;
            hintBox.style.display = 'block';
        } else {
            hintBox.style.display = 'none';
        }
    }

    // Allow "Enter" key submission
    document.getElementById('user-answer').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            checkAnswer();
        }
    });

    // Start game on load
    generatePuzzle();
</script>

</body>
</html>
