<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customizable Algebra Emoji Logic Puzzle</title>
    <style>
        :root {
            --bg-color: #f4f7fe;
            --card-bg: #ffffff;
            --primary: #4361ee;
            --primary-hover: #3a56d4;
            --success: #2ec4b6;
            --error: #e63946;
            --text: #2b2d42;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .game-card {
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 30px;
            max-width: 550px;
            width: 100%;
            text-align: center;
        }

        h1, h2 { margin-top: 0; }

        /* Menu Styles */
        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        select, input[type="number"] {
            width: 100%;
            padding: 10px;
            font-size: 1rem;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            box-sizing: border-box;
        }

        .checkbox-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: normal;
            background: #f8f9fa;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #edf2f7;
            cursor: pointer;
        }

        .range-inputs {
            display: flex;
            gap: 10px;
        }

        /* Game Screen Styles */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .badge {
            background: #eef2ff;
            color: var(--primary);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.95rem;
        }

        .equation-box {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border: 2px solid #edf2f7;
        }

        .target-equation {
            background: #eef2ff;
            border-color: #c7d2fe;
            font-weight: bold;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn:active { transform: scale(0.98); }
        .btn-primary { background-color: var(--primary); color: white; width: 100%; }
        .btn-primary:hover { background-color: var(--primary-hover); }
        .btn-submit { background-color: var(--primary); color: white; }
        .btn-secondary { background-color: #e2e8f0; color: #475569; margin-top: 10px; width: 100%; }

        .feedback {
            margin-top: 15px;
            font-weight: bold;
            min-height: 24px;
        }
        .feedback.correct { color: var(--success); }
        .feedback.incorrect { color: var(--error); }
        .hint-text { color: #64748b; font-size: 0.9rem; margin-top: 8px; text-align: left; background: #f8f9fa; padding: 10px; border-radius: 8px; }
    </style>
</head>
<body>

<div class="game-card">
    <div id="menu-screen">
        <h1>Puzzle Setup</h1>
        <p style="color: #64748b; font-size: 0.95rem; margin-bottom: 25px;">Customize the math challenge options below:</p>

        <div class="form-group">
            <label for="num-vars">Number of Variables (Symbols):</label>
            <select id="num-vars">
                <option value="2">2 Symbols (Easy)</option>
                <option value="3" selected>3 Symbols (Medium)</option>
                <option value="4">4 Symbols (Hard)</option>
            </select>
        </div>

        <div class="form-group">
            <label>Allowed Operations:</label>
            <div class="checkbox-group">
                <label class="checkbox-label"><input type="checkbox" id="op-add" checked disabled> Addition (+)</label>
                <label class="checkbox-label"><input type="checkbox" id="op-sub" checked> Subtraction (-)</label>
                <label class="checkbox-label"><input type="checkbox" id="op-mul" checked> Multiplication (×)</label>
                <label class="checkbox-label"><input type="checkbox" id="op-div"> Division (÷)</label>
            </div>
        </div>

        <div class="form-group">
            <label>Value Range for Symbols:</label>
            <div class="range-inputs">
                <input type="number" id="val-min" value="1" min="1" placeholder="Min">
                <input type="number" id="val-max" value="10" min="2" placeholder="Max">
            </div>
        </div>

        <button class="btn btn-primary" onclick="startGame()">Start Game 🚀</button>
    </div>

    <div id="game-screen" style="display: none;">
        <div class="header">
            <span class="badge" id="score-display">Score: 0</span>
            <button class="btn btn-secondary" style="width: auto; margin:0; padding: 6px 12px;" onclick="showMenu()">⚙️ Settings</button>
        </div>

        <div id="equations-container"></div>

        <div class="input-group">
            <input type="number" id="user-answer" placeholder="?" autocomplete="off">
            <button class="btn btn-submit" onclick="checkAnswer()">Submit</button>
        </div>

        <div class="feedback" id="feedback"></div>
        <button class="btn btn-secondary" onclick="toggleHint()">💡 Need a Hint?</button>
        <div class="hint-text" id="hint-box" style="display: none;"></div>
    </div>
</div>

<script>
    const SYMBOLS_POOL = ['🍎', '🍌', '🍇', '🍊', '🍓', '🥑', '🍍', '🍉'];
    
    // Config state
    let config = {
        numVars: 3,
        ops: ['+'],
        minVal: 1,
        maxVal: 10
    };

    let currentSolution = 0;
    let currentScore = 0;
    let currentHint = "";
    let activeVars = [];

    function getRandomInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function getRandomElement(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
    }

    function showMenu() {
        document.getElementById('menu-screen').style.display = 'block';
        document.getElementById('game-screen').style.display = 'none';
    }

    function startGame() {
        // Parse settings from Menu
        config.numVars = parseInt(document.getElementById('num-vars').value, 10);
        
        config.ops = ['+'];
        if (document.getElementById('op-sub').checked) config.ops.push('-');
        if (document.getElementById('op-mul').checked) config.ops.push('*');
        if (document.getElementById('op-div').checked) config.ops.push('/');

        let min = parseInt(document.getElementById('val-min').value, 10) || 1;
        let max = parseInt(document.getElementById('val-max').value, 10) || 10;
        if (min >= max) max = min + 5;
        config.minVal = min;
        config.maxVal = max;

        document.getElementById('menu-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'block';

        generatePuzzle();
    }

    function evaluateOp(a, op, b) {
        switch(op) {
            case '+': return a + b;
            case '-': return a - b;
            case '*': return a * b;
            case '/': return a / b;
        }
    }

    function formatOp(op) {
        if (op === '*') return '×';
        if (op === '/') return '÷';
        return op;
    }

    function generatePuzzle() {
        document.getElementById('feedback').innerText = '';
        document.getElementById('user-answer').value = '';
        document.getElementById('hint-box').style.display = 'none';

        // Select symbols and assign values
        const shuffled = [...SYMBOLS_POOL].sort(() => 0.5 - Math.random());
        activeVars = [];
        
        for (let i = 0; i < config.numVars; i++) {
            let val = getRandomInt(config.minVal, config.maxVal);
            activeVars.push({ symbol: shuffled[i], value: val });
        }

        let equationsHTML = "";
        let hintSteps = [];

        // Generate line per variable to allow solving one-by-one
        for (let i = 0; i < config.numVars; i++) {
            const current = activeVars[i];

            if (i === 0) {
                // First variable: A + A = total
                const total = current.value + current.value;
                equationsHTML += `<div class="equation-box">${current.symbol} + ${current.symbol} = ${total}</div>`;
                hintSteps.push(`2 × ${current.symbol} = ${total} → <b>${current.symbol} = ${current.value}</b>`);
            } else {
                // Subsequent variables: mix with previous variables
                const prev = activeVars[i - 1];
                let op = getRandomElement(config.ops);
                
                // Avoid fraction/negative complications for lower levels
                if (op === '/' && (prev.value % current.value !== 0))
